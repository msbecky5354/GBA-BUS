name: Sync Encrypted Data from Google

on:
  workflow_dispatch: # 保持手動執行

env:
  # 真正嘅永久解決方案：完全唔 Hardcode，由 GitHub Secrets 動態讀取
  GAS_API_URL: ${{ secrets.GAS_API_URL }}

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Fetch Data from Google Apps Script
        run: |
          mkdir -p public
          # 動態讀取環境變數，完美抓取 JSON
          curl -L -o public/encrypted-data.json "${{ env.GAS_API_URL }}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 強制將 PAT Token 注入 remote URL，徹底解決 git push 403 權限不足問題
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/msbecky5354/GBA-BUS.git
          
          git add public/encrypted-data.json
          
          # 檢查是否有內容更新，避免無意義嘅 commit
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync latest JSON data from GAS"
            git push
          else
            echo "數據冇改變，無需更新"
          fi
