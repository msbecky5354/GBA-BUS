name: Sync Encrypted Data from Google

on:
  workflow_dispatch:    # 只保留手動撳掣

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4[cite: 2]

      - name: Fetch Data from Google Apps Script
        run: |
          mkdir -p public
          curl -L -o public/encrypted-data.json "https://script.google.com/macros/s/AKfycbxZbsC7Jz5hZ29WmG3lUHTPO4dhRX-vZxHF1Bz7TAf_jdwgOoLqW8Yhtmy95ie7pgzDDg/exec"[cite: 2]

      - name: Verify Data Content (Prevent Saving HTML Error Page)
        run: |
          # 檢查下載檔案是否包含 HTML 標籤
          if grep -iq -E '<!DOCTYPE|<html' public/encrypted-data.json; then
            echo "❌ 錯誤：Google Apps Script 返還咗 HTML 登入/警告頁面，非合法數據！"
            echo "請去 GAS 設定：Deploy -> New deployment -> Who has access 設為 'Anyone'。"
            exit 1
          fi
          echo "✅ 數據內容驗證通過，準備提交至 Git。"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"[cite: 2]
          git config --global user.email "action@github.com"[cite: 2]
          
          if [[ -n "$(git status --porcelain)" ]]; then[cite: 2]
            git add .[cite: 2]
            git commit -m "Manual sync encrypted data from Google [skip ci]"[cite: 2]
            git push[cite: 2]
          else
            echo "數據冇改變，無需更新"[cite: 2]
          fi
