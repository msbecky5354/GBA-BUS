name: Sync Encrypted Data from Google

on:
  workflow_dispatch:    # 只保留手動撳掣

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 👇 加入以下呢行，載入真人權限，強制喚醒 GitHub Pages 自動部署
          token: ${{ secrets.PAT_TOKEN }}

      - name: Align Remote Branch (Prevent Conflict)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch Data from Google Apps Script
        run: |
          mkdir -p public
          curl -L -o public/encrypted-data.json "https://script.google.com/macros/s/AKfycbwQ3RdAhOvY_vMMpibItdVg4CuzuX6_kJlnw_d2BoL8NBqZYEiLoeuwpUe-jIxoE7ocwA/exec"

      - name: Verify Data Content (Prevent Saving HTML Error Page)
        run: |
          # 檢查下載檔案是否包含 HTML 標籤
          if grep -iq -E '<!DOCTYPE|<html' public/encrypted-data.json; then
            echo "❌ 錯誤：Google Apps Script 返還咗 HTML 登入/警告頁面，非合法數據！"
            echo "請去 GAS 設定：Deploy -> New deployment -> Who has access 設為 'Anyone'。"
            exit 1
          fi
          echo "✅ 數據內容驗證通過，準備提交至 Git。"

      - name: Commit and Push Changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add public/encrypted-data.json
            git commit -m "Manual sync encrypted data from Google"
            git push origin main
          else
            echo "數據冇改變，無需更新"
          fi
