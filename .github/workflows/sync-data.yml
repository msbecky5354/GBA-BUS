name: Sync Encrypted Data from Google

on:
  workflow_dispatch:    # 只保留手動撳掣

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Google Apps Script
        run: |
          curl -L -o public/encrypted-data.json "https://script.google.com/macros/s/AKfycbxZbsC7Jz5hZ29WmG3lUHTPO4dhRX-vZxHF1Bz7TAf_jdwgOoLqW8Yhtmy95ie7pgzDDg/exec"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Manual sync encrypted data from Google [skip ci]"
            git push
          else
            echo "數據冇改變，無需更新"
          fi
